events {}

http {
    # Content types of the files nginx serves itself (the uploaded images).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;

        # Docker's embedded DNS. With the upstream in a variable, nginx
        # re-resolves the container name instead of caching the IP from
        # startup, so recreating backend or frontend does not cause a 502.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Image uploads (HU019); the backend enforces the real limit (UPLOAD_MAX_SIZE).
        client_max_body_size 10m;

        # Uploaded images, straight from the shared volume. Names are unique UUIDs,
        # so a file never changes and can be cached for a long time.
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        location /api/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
