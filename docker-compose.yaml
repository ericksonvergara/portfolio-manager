services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    networks:
      - portfolio-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE}"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (min. 32 bytes)}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-15m}"
      JWT_REFRESH_TOKEN_TTL: "${JWT_REFRESH_TOKEN_TTL:-7d}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      API_DOCS_ENABLED: "${API_DOCS_ENABLED:-true}"
      SPRING_FLYWAY_LOCATIONS: "${SPRING_FLYWAY_LOCATIONS:-classpath:db/migration}"
      MAIL_HOST: "${MAIL_HOST:-mailpit}"
      MAIL_PORT: "${MAIL_PORT:-1025}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-false}"
      MAIL_SMTP_STARTTLS: "${MAIL_SMTP_STARTTLS:-false}"
      MAIL_FROM: "${MAIL_FROM:-Portfolio Manager <no-reply@portfolio.local>}"
      PASSWORD_RESET_URL: "${PASSWORD_RESET_URL:-http://localhost:8081/restablecer-contrasena}"
      PASSWORD_RESET_TTL: "${PASSWORD_RESET_TTL:-30m}"
      UPLOADS_DIR: /app/uploads
      UPLOAD_MAX_SIZE: "${UPLOAD_MAX_SIZE:-5MB}"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - portfolio-network

  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-network

  # Local mail catcher (HU010): receives every email sent by the backend instead of delivering it.
  # Inbox at http://localhost:8025; replace MAIL_* with a real SMTP server in production.
  mailpit:
    image: axllent/mailpit:v1.25.1
    container_name: portfolio-mailpit
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - portfolio-network

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network

networks:
  portfolio-network:

volumes:
  postgres-data:
  # Images uploaded from the admin panel (HU019): written by the backend, served by nginx.
  uploads: