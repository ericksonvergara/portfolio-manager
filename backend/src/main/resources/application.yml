spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  servlet:
    multipart:
      # The file limit is UPLOAD_MAX_SIZE; the request adds a little room for the other form fields.
      max-file-size: ${UPLOAD_MAX_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}

  mail:
    # Generic SMTP; locally and in CI the server is Mailpit (no real delivery).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  # Served under /api so nginx proxies it to the backend like the rest of the API.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs/openapi
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs/swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
    com.portafolio_manager.backend: DEBUG
    org.springframework.web: INFO

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:portfolio-manager}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}

  uploads:
    # Docker mounts the uploads volume here; nginx serves it under /uploads/.
    dir: ${UPLOADS_DIR:./uploads}
    max-size: ${UPLOAD_MAX_SIZE:5MB}

  password-reset:
    ttl: ${PASSWORD_RESET_TTL:30m}
    # Frontend page that receives ?token=… (HU010)
    url: ${PASSWORD_RESET_URL:http://localhost:8081/restablecer-contrasena}
    mail-from: ${MAIL_FROM:Portfolio Manager <no-reply@portfolio.local>}

  bootstrap:
    admin:
      name: ${ADMIN_NAME:Administrador}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
