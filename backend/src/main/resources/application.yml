spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    com.portafolio_manager.backend: DEBUG
    org.springframework.web: INFO

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:portfolio-manager}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}

  bootstrap:
    admin:
      name: ${ADMIN_NAME:Administrador}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
