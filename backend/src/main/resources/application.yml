spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  servlet:
    multipart:
      # The file limit is UPLOAD_MAX_SIZE; the request adds a little room for the other form fields.
      max-file-size: ${UPLOAD_MAX_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  # Served under /api so nginx proxies it to the backend like the rest of the API.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs/openapi
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/docs/swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
    com.portafolio_manager.backend: DEBUG
    org.springframework.web: INFO

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:portfolio-manager}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}

  uploads:
    # Docker mounts the uploads volume here; nginx serves it under /uploads/.
    dir: ${UPLOADS_DIR:./uploads}
    max-size: ${UPLOAD_MAX_SIZE:5MB}

  bootstrap:
    admin:
      name: ${ADMIN_NAME:Administrador}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
