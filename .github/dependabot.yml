# ============================================================================
# Portfolio Manager
# File: .github/dependabot.yml
# Version: 1.3.0
# Description: Dependabot configuration. Minor and patch updates are grouped
#              into one Pull Request per ecosystem against develop;
#              major versions are ignored.
# Author: Erickson Vergara
# Repository: https://github.com/ericksonvergara/portfolio-manager
# License: MIT
# ============================================================================

version: 2

updates:
  # --------------------------------------------------------------------------
  # GitHub Actions
  # --------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --------------------------------------------------------------------------
  # Backend - Gradle (Spring Boot)
  # --------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --------------------------------------------------------------------------
  # Frontend - npm (React)
  # --------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --------------------------------------------------------------------------
  # Docker
  # --------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
