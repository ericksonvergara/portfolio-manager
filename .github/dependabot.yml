# ============================================================================
# Portfolio Manager
# File: .github/dependabot.yml
# Version: 1.0.0
# Description: Dependabot configuration
# Author: Erickson Vergara
# Repository: https://github.com/ericksonvergara/portfolio-manager
# License: MIT
# ============================================================================

version: 2

updates:
  # --------------------------------------------------------------------------
  # GitHub Actions
  # --------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # --------------------------------------------------------------------------
  # Backend - Maven (Spring Boot)
  # --------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"

  # --------------------------------------------------------------------------
  # Frontend - npm (React)
  # --------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"

  # --------------------------------------------------------------------------
  # Docker
  # --------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

ignore:
  - dependency-name: "*"
    update-types:
      - "version-update:semver-major"
